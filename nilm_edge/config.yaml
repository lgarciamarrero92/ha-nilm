name: "NILM"
version: "1.1.9"
slug: "nilm"
description: "Non-Intrusive Load Monitoring For Home Assistant"
url: "https://ha-nilm.bigwicho.com/"
image: "ghcr.io/lgarciamarrero92/ha-nilm-edge"
homeassistant_api: true
hassio_api: true
hassio_role: manager
startup: application
panel_icon: "mdi:flash"
panel_title: "NILM"
ports:
  "8099/tcp": 8099

ingress: true

options:
  # Embedding/inference batch size used by training preparation and prediction previews.
  batch_size: 1024
  # Maximum expected mains sensor update gap in seconds. Increase this for slower sensors, but larger gaps can reduce NILM accuracy.
  sensor_max_gap_s: 60

schema:
  # Keep memory usage bounded on small Home Assistant hosts.
  batch_size: "int(32,8192)"
  # Accept sensors from near-real-time updates up to minutes cadence
  sensor_max_gap_s: "float(1,3600)"

arch:
  - aarch64
  - amd64
